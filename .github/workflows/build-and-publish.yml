name: Build and Publish MeusDocs Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/BUILD_TRIGGER'

permissions:
  contents: write

concurrency:
  group: meusdocs-public-beta
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: lcsmjr/meus-docs
          token: ${{ secrets.MEUSDOCS_SOURCE_TOKEN }}
          path: source

      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.MEUSDOCS_SOURCE_TOKEN }}
          BETA_KEYSTORE_B64: ${{ secrets.MEUSDOCS_BETA_KEYSTORE_B64 }}
        run: |
          test -n "$SOURCE_TOKEN" || (echo "Missing MEUSDOCS_SOURCE_TOKEN" && exit 1)
          test -n "$BETA_KEYSTORE_B64" || (echo "Missing MEUSDOCS_BETA_KEYSTORE_B64" && exit 1)

      - name: Validate and extract MeusDocs source
        shell: bash
        run: |
          echo "44b0b488202929034371567ba821323984cd19e6242b6cd3fb6cc86de9b5ddc6  source/ci/meusdocs_source.tar.gz" | sha256sum -c -
          mkdir -p meusdocs_app
          tar -xzf source/ci/meusdocs_source.tar.gz -C meusdocs_app

      - name: Apply updater patch
        shell: bash
        run: |
          mkdir -p meusdocs_app/lib/core/update
          mkdir -p meusdocs_app/lib/core/official_documents
          mkdir -p meusdocs_app/lib/core/services
          mkdir -p meusdocs_app/lib/core/vault
          mkdir -p meusdocs_app/lib/features/company
          mkdir -p meusdocs_app/lib/features/documents
          mkdir -p meusdocs_app/lib/features/official_documents
          mkdir -p meusdocs_app/lib/features/personal
          mkdir -p meusdocs_app/lib/features/profile
          mkdir -p meusdocs_app/lib/features/settings
          mkdir -p meusdocs_app/lib/features/shared
          mkdir -p meusdocs_app/lib/features/wallet
          cp source/ci/patches/lib/core/official_documents/official_document_catalog.dart meusdocs_app/lib/core/official_documents/
          cp source/ci/patches/lib/core/official_documents/official_document_engine.dart meusdocs_app/lib/core/official_documents/
          cp source/ci/patches/lib/core/official_documents/official_document_metadata_extractor.dart meusdocs_app/lib/core/official_documents/
          cp source/ci/patches/lib/core/official_documents/official_document_portal_adapter.dart meusdocs_app/lib/core/official_documents/
          cp source/ci/patches/lib/core/update/app_update_service.dart meusdocs_app/lib/core/update/
          cp source/ci/patches/lib/core/update/update_prompt.dart meusdocs_app/lib/core/update/
          cp source/ci/patches/lib/core/update/update_notification_service.dart meusdocs_app/lib/core/update/
          cp source/ci/patches/lib/core/services/pending_share.dart meusdocs_app/lib/core/services/
          cp source/ci/patches/lib/core/services/tcu_consolidated_service.dart meusdocs_app/lib/core/services/
          cp source/ci/patches/lib/core/services/transparency_sanctions_service.dart meusdocs_app/lib/core/services/
          cp source/ci/patches/lib/core/services/integrity_report_service.dart meusdocs_app/lib/core/services/
          cp source/ci/patches/lib/core/vault/document_classifier.dart meusdocs_app/lib/core/vault/
          cp source/ci/patches/lib/features/company/company_screen.dart meusdocs_app/lib/features/company/
          cp source/ci/patches/lib/features/company/tcu_company_query_screen.dart meusdocs_app/lib/features/company/
          cp source/ci/patches/lib/features/company/state_certificate_screen.dart meusdocs_app/lib/features/company/
          cp source/ci/patches/lib/features/documents/category_documents_screen.dart meusdocs_app/lib/features/documents/
          cp source/ci/patches/lib/features/official_documents/official_document_browser_screen.dart meusdocs_app/lib/features/official_documents/
          cp source/ci/patches/lib/features/personal/personal_services_screen.dart meusdocs_app/lib/features/personal/
          cp source/ci/patches/lib/features/personal/trusted_portal_screen.dart meusdocs_app/lib/features/personal/
          cp source/ci/patches/lib/features/profile/profile_screen.dart meusdocs_app/lib/features/profile/
          cp source/ci/patches/lib/features/settings/transparency_api_settings_screen.dart meusdocs_app/lib/features/settings/
          cp source/ci/patches/lib/features/shared/share_intent_router.dart meusdocs_app/lib/features/shared/
          cp source/ci/patches/lib/features/shared/main_shell.dart meusdocs_app/lib/features/shared/
          cp source/ci/patches/lib/features/shared/brand_logo.dart meusdocs_app/lib/features/shared/
          cp source/ci/patches/lib/features/shared/startup_splash.dart meusdocs_app/lib/features/shared/
          cp source/ci/patches/lib/features/wallet/incoming_share_screen.dart meusdocs_app/lib/features/wallet/
          cp source/ci/patches/lib/features/wallet/wallet_screen.dart meusdocs_app/lib/features/wallet/

          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('meusdocs_app/pubspec.yaml')
          text = pubspec.read_text()
          text = text.replace('version: 0.1.0+1', 'version: 0.5.0+1')
          if '  flutter_localizations:' not in text:
              text = text.replace(
                  'dependencies:\n  flutter:\n    sdk: flutter\n',
                  'dependencies:\n'
                  '  flutter:\n'
                  '    sdk: flutter\n'
                  '  flutter_localizations:\n'
                  '    sdk: flutter\n'
              )
          if '  http: ^1.6.0' not in text:
              text = text.replace(
                  '  file_picker: ^13.1.0',
                  '  file_picker: ^13.1.0\n'
                  '  http: ^1.6.0\n'
                  '  package_info_plus: ^10.2.1\n'
                  '  open_filex: ^4.7.0\n'
                  '  crypto: ^3.0.6'
              )
          if '  url_launcher: ^6.3.2' not in text:
              text = text.replace(
                  '  crypto: ^3.0.6',
                  '  crypto: ^3.0.6\n'
                  '  url_launcher: ^6.3.2'
              )
          if '  pdf: ^3.11.3' not in text:
              text = text.replace(
                  '  url_launcher: ^6.3.2',
                  '  url_launcher: ^6.3.2\n'
                  '  pdf: ^3.11.3'
              )
          if '  flutter_inappwebview: ^6.1.5' not in text:
              text = text.replace(
                  '  pdf: ^3.11.3',
                  '  pdf: ^3.11.3\n'
                  '  flutter_inappwebview: ^6.1.5'
              )
          if '  flutter_local_notifications: ^22.3.1' not in text:
              text = text.replace(
                  '  flutter_inappwebview: ^6.1.5',
                  '  flutter_inappwebview: ^6.1.5\n'
                  '  flutter_local_notifications: ^22.3.1\n'
                  '  workmanager: ^0.10.10'
              )
          if '  pdfrx: ^2.4.8' not in text:
              text = text.replace(
                  '  workmanager: ^0.10.10',
                  '  workmanager: ^0.10.10\n'
                  '  pdfrx: ^2.4.8\n'
                  '  share_plus: ^13.3.0\n'
                  '  cross_file: ^0.3.5+5'
              )
          pubspec.write_text(text)

          shell = Path('meusdocs_app/lib/features/shared/main_shell.dart')
          text = shell.read_text()
          if "import '../profile/profile_screen.dart';" not in text:
              text = text.replace(
                  "import '../wallet/wallet_screen.dart';",
                  "import '../wallet/wallet_screen.dart';\n"
                  "import '../profile/profile_screen.dart';\n"
                  "import '../../core/update/update_prompt.dart';\n"
                  "import '../../core/update/update_notification_service.dart';"
              )
          if 'checkAndPromptForUpdate(context);' not in text:
              text = text.replace(
                  '  int index = 0;\n\n  final pages',
                  '  int index = 0;\n\n'
                  '  @override\n'
                  '  void initState() {\n'
                  '    super.initState();\n'
                  '    WidgetsBinding.instance.addPostFrameCallback((_) {\n'
                  '      UpdateNotificationService.instance.initializeAndSchedule();\n'
                  '      checkAndPromptForUpdate(context);\n'
                  '    });\n'
                  '  }\n\n'
                  '  final pages'
              )
          text = text.replace(
              "    _Placeholder(title: 'Perfil'),",
              '    ProfileScreen(),'
          )
          shell.write_text(text)

          main = Path('meusdocs_app/lib/main.dart')
          text = main.read_text()
          if "package:flutter_localizations/flutter_localizations.dart" not in text:
              text = text.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\n"
                  "import 'package:flutter_localizations/flutter_localizations.dart';"
              )
          if 'GlobalMaterialLocalizations.delegate' not in text:
              text = text.replace(
                  'MaterialApp(\n',
                  "MaterialApp(\n"
                  "      locale: const Locale('pt', 'BR'),\n"
                  "      supportedLocales: const [Locale('pt', 'BR')],\n"
                  "      localizationsDelegates: const [\n"
                  "        GlobalMaterialLocalizations.delegate,\n"
                  "        GlobalWidgetsLocalizations.delegate,\n"
                  "        GlobalCupertinoLocalizations.delegate,\n"
                  "      ],\n",
                  1
              )
          if "share_intent_router.dart" not in text:
              text = text.replace(
                  "import 'features/shared/main_shell.dart';",
                  "import 'features/shared/main_shell.dart';\n"
                  "import 'features/shared/share_intent_router.dart';\n"
                  "import 'features/shared/startup_splash.dart';"
              )
          text = text.replace(
              'home: const MainShell(),',
              'home: const StartupSplash(child: ShareIntentRouter(child: MainShell())), '
          )
          text = text.replace(
              'home: MainShell(),',
              'home: const StartupSplash(child: ShareIntentRouter(child: MainShell())), '
          )
          main.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform files
        working-directory: meusdocs_app
        run: flutter create --platforms=android --org com.meusdocs .

      - name: Create MeusDocs adaptive launcher icon
        shell: bash
        run: |
          mkdir -p meusdocs_app/android/app/src/main/res/drawable
          mkdir -p meusdocs_app/android/app/src/main/res/mipmap-anydpi
          mkdir -p meusdocs_app/android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p meusdocs_app/android/app/src/main/res/values

          cat > meusdocs_app/android/app/src/main/res/drawable/meusdocs_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0C4AA6"
                  android:pathData="M25,30h44a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-44a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#18C6B6"
                  android:pathData="M31,24h44a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-44a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,18h39a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-39a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#88B4E3"
                  android:pathData="M46,35h24v4h-24zM46,46h30v4h-30zM46,57h20v4h-20z" />
              <path
                  android:fillColor="#0A5FC1"
                  android:pathData="M63,58l14,-7l14,7v15c0,10 -6,18 -14,23c-8,-5 -14,-13 -14,-23z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M70,72l5,5l10,-12l4,4l-14,16l-9,-9z" />
          </vector>
          XML

          cat > meusdocs_app/android/app/src/main/res/mipmap-anydpi/meusdocs_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#F4FAFF"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#0C4AA6"
                  android:pathData="M25,30h44a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-44a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#18C6B6"
                  android:pathData="M31,24h44a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-44a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,18h39a8,8 0,0 1,8 8v42a8,8 0,0 1,-8 8h-39a8,8 0,0 1,-8 -8v-42a8,8 0,0 1,8 -8z" />
              <path
                  android:fillColor="#88B4E3"
                  android:pathData="M46,35h24v4h-24zM46,46h30v4h-30zM46,57h20v4h-20z" />
              <path
                  android:fillColor="#0A5FC1"
                  android:pathData="M63,58l14,-7l14,7v15c0,10 -6,18 -14,23c-8,-5 -14,-13 -14,-23z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M70,72l5,5l10,-12l4,4l-14,16l-9,-9z" />
          </vector>
          XML

          cat > meusdocs_app/android/app/src/main/res/values/meusdocs_colors.xml <<'XML'
          <resources>
              <color name="meusdocs_launcher_bg">#F4FAFF</color>
          </resources>
          XML

          cat > meusdocs_app/android/app/src/main/res/mipmap-anydpi-v26/meusdocs_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/meusdocs_launcher_bg" />
              <foreground android:drawable="@drawable/meusdocs_foreground" />
          </adaptive-icon>
          XML

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('meusdocs_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/meusdocs_launcher"'
          )
          if 'android:roundIcon=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:roundIcon="@mipmap/meusdocs_launcher"',
                  1
              )
          manifest.write_text(text)
          PY

      - name: Set Android app name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('meusdocs_app/android/app/src/main/AndroidManifest.xml')
          text = p.read_text().replace('android:label="meusdocs_mvp"', 'android:label="MeusDocs"')
          p.write_text(text)
          PY

      - name: Use smaller Gradle distribution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('meusdocs_app/android/gradle/wrapper/gradle-wrapper.properties')
          text = p.read_text().replace('-all.zip', '-bin.zip')
          p.write_text(text)
          PY

      - name: Configure notification Gradle support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('meusdocs_app/android/app/build.gradle.kts')
          text = p.read_text()

          text = text.replace(
              'sourceCompatibility = JavaVersion.VERSION_11',
              'sourceCompatibility = JavaVersion.VERSION_17'
          )
          text = text.replace(
              'targetCompatibility = JavaVersion.VERSION_11',
              'targetCompatibility = JavaVersion.VERSION_17'
          )

          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1
              )

          if 'desugar_jdk_libs:2.1.4' not in text:
              text += '''
              
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''

          p.write_text(text)
          PY

      - name: Configure Android permissions and share target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('meusdocs_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = (
              '\n    <uses-permission android:name="android.permission.INTERNET" />'
              '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          )
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text = text.replace(marker, marker + permissions)

          # O plugin recomenda singleTask para receber novos intents
          # sem abrir múltiplas instâncias da MainActivity.
          text = text.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTask"'
          )

          share_filters = r'''
                <!-- MeusDocs: receber arquivos compartilhados -->
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="application/pdf" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="image/*" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="application/pkcs7-signature" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="application/x-pkcs7-signature" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="application/pdf" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="image/*" />
                </intent-filter>

                <!-- MeusDocs: aparecer em "Abrir com" para documentos locais -->
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:scheme="content" android:mimeType="application/pdf" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:scheme="content" android:mimeType="image/*" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:scheme="content" android:mimeType="application/pkcs7-signature" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:scheme="content" android:mimeType="application/x-pkcs7-signature" />
                </intent-filter>
          '''

          if 'MeusDocs: receber arquivos compartilhados' not in text:
              insertion = '</activity>'
              text = text.replace(insertion, share_filters + '\n            ' + insertion, 1)

          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: meusdocs_app
        run: flutter pub get

      - name: Patch flutter_inappwebview Android ProGuard compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          pub_cache = Path(os.environ["PUB_CACHE"])
          files = list(
              pub_cache.glob(
                  "hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle"
              )
          )

          if not files:
              raise SystemExit(
                  "flutter_inappwebview_android build.gradle not found"
              )

          old = "getDefaultProguardFile('proguard-android.txt')"
          new = "getDefaultProguardFile('proguard-android-optimize.txt')"

          patched = 0
          for p in files:
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
                  patched += 1

          remaining = [
              str(p)
              for p in files
              if old in p.read_text()
          ]
          if remaining:
              raise SystemExit(
                  "ProGuard compatibility patch failed for: "
                  + ", ".join(remaining)
              )

          print(
              f"Checked {len(files)} flutter_inappwebview Android plugin(s); "
              f"patched {patched}."
          )
          PY

      - name: Patch receive_sharing_intent JVM target
        shell: bash
        run: |
          PLUGIN_DIR="$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'receive_sharing_intent-1.8.1' | head -n 1)"
          test -n "$PLUGIN_DIR"
          cat >> "$PLUGIN_DIR/android/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Configure stable beta signing
        shell: bash
        env:
          BETA_KEYSTORE_B64: ${{ secrets.MEUSDOCS_BETA_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$BETA_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Configure explicit persistent beta signing
        shell: bash
        run: |
          cat > meusdocs_app/android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/debug.keystore
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('meusdocs_app/android/app/build.gradle.kts')
          text = p.read_text()

          marker = 'android {'
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n\n'
          if 'import java.util.Properties' not in text:
              text = imports + text

          signing_block = '''
          val betaKeystoreProperties = Properties()
          val betaKeystorePropertiesFile = rootProject.file("key.properties")
          betaKeystoreProperties.load(FileInputStream(betaKeystorePropertiesFile))

          '''
          if 'betaKeystoreProperties' not in text:
              text = text.replace(marker, signing_block + marker, 1)

          build_marker = '    buildTypes {'
          config = '''    signingConfigs {
              create("betaRelease") {
                  keyAlias = betaKeystoreProperties["keyAlias"] as String
                  keyPassword = betaKeystoreProperties["keyPassword"] as String
                  storeFile = file(betaKeystoreProperties["storeFile"] as String)
                  storePassword = betaKeystoreProperties["storePassword"] as String
              }
          }

          '''
          if 'create("betaRelease")' not in text:
              text = text.replace(build_marker, config + build_marker, 1)

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("betaRelease")'
          )
          p.write_text(text)
          PY

      - name: Set build version
        shell: bash
        run: echo "APP_VERSION=0.6.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Analyze source
        working-directory: meusdocs_app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build signed beta APK
        working-directory: meusdocs_app
        shell: bash
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed on attempt $attempt; retrying transient downloads..."
              sleep 15
            fi
          done
          exit 1

      - name: Verify persistent Android signing
        shell: bash
        run: |
          CURRENT="meusdocs_app/build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --print-certs "$CURRENT" > current-certs.txt
          cat current-certs.txt

          APK_CERT="$(grep -i 'certificate SHA-256 digest' current-certs.txt | head -n 1 | sed 's/.*: *//')"
          KEY_CERT="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"

          PACKAGE="$("$AAPT" dump badging "$CURRENT" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$("$AAPT" dump badging "$CURRENT" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"

          echo "Package: $PACKAGE"
          echo "Version code: $VERSION_CODE"
          echo "APK cert SHA-256: $APK_CERT"
          echo "Keystore cert SHA-256: $KEY_CERT"

          test "$PACKAGE" = "com.meusdocs.meusdocs_mvp" || (echo "Unexpected package ID" && exit 1)
          test -n "$APK_CERT" || (echo "Could not read APK certificate" && exit 1)
          test -n "$KEY_CERT" || (echo "Could not read keystore certificate" && exit 1)
          test "$APK_CERT" = "$KEY_CERT" || (echo "APK is not signed with the persistent beta key" && exit 1)

      - name: Prepare release files
        shell: bash
        run: |
          cp meusdocs_app/build/app/outputs/flutter-apk/app-release.apk MeusDocs-beta.apk
          sha256sum MeusDocs-beta.apk > MeusDocs-beta.apk.sha256

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          REPO="lcsmjr/meus-docs-updates"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" MeusDocs-beta.apk MeusDocs-beta.apk.sha256 --repo "$REPO" --clobber
          else
            gh release create "$TAG" MeusDocs-beta.apk MeusDocs-beta.apk.sha256 \
              --repo "$REPO" \
              --title "MeusDocs Beta $APP_VERSION" \
              --notes "Versão beta automática do MeusDocs para atualização interna do aplicativo."
          fi
